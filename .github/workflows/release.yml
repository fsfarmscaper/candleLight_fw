name: Build qtcandlelightcanbus

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 plugin
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtserialbus'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: cmd
        run: |
          qmake qtcandlelightcanbus.pro CONFIG+=release

      - name: Build
        shell: cmd
        run: |
          nmake

      - name: Locate DLL
        shell: powershell
        run: |
          Write-Host "Searching for qtcandlelightcanbus.dll..."
          Get-ChildItem -Path . -Filter qtcandlelightcanbus.dll -Recurse

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist

          $dll = Get-ChildItem `
            -Path . `
            -Filter qtcandlelightcanbus.dll `
            -Recurse |
            Select-Object -First 1

          if (-not $dll) {
            Write-Error "qtcandlelightcanbus.dll not found"
            exit 1
          }

          Copy-Item $dll.FullName dist\qtcandlelightcanbus.dll

          @"
          SavvyCAN candleLight Windows plugin

          Built from:
          $env:GITHUB_REPOSITORY

          Commit:
          $env:GITHUB_SHA

          Qt:
          5.15.2 MSVC2019 64-bit

          Build configuration:
          Release
          "@ | Out-File dist\BUILD-INFO.txt -Encoding utf8

          Compress-Archive `
            -Path dist\qtcandlelightcanbus.dll,dist\BUILD-INFO.txt `
            -DestinationPath qtcandlelightcanbus-windows-x64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: qtcandlelightcanbus-windows-x64
          path: qtcandlelightcanbus-windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: qtcandlelightcanbus-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
